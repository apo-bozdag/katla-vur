<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katla Vur</title>
<meta name="description" content="Kâğıdı katla, ojeyi bastır, rakibin adamlarını vur. İki kişilik ya da bilgisayara karşı.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fbf9f3'/%3E%3Cpath d='M16 3v26' stroke='%23201e25' stroke-width='2.5'/%3E%3Ccircle cx='10' cy='14' r='5' fill='%23d11f3c'/%3E%3Ccircle cx='22' cy='14' r='5' fill='%23d11f3c' opacity='.7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Shantell+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://www.parolla.app/sdk/v1.js"></script>
<style>
:root{
  --granite:#79736d; --granite-2:#5c5753;
  --paper:#fbf9f3; --paper-2:#eeeae1;
  --ink:#201e25; --ink-soft:#4b4751;
  --p0:#d11f3c; --p1:#0e8496;
  --hand:'Shantell Sans','Comic Sans MS','Segoe Print',system-ui,sans-serif;
  --brush:'Caveat Brush','Shantell Sans','Segoe Print',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --granite:#5a5551; --granite-2:#423e3b; }
}
:root[data-theme="dark"]{ --granite:#5a5551; --granite-2:#423e3b; }
html{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background-color:var(--granite);color:var(--ink);font-family:var(--hand);overflow:hidden;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;}
body.booting #app,body.booting .overlay{visibility:hidden}

/* top bar */
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:16px clamp(12px,3vw,44px) 4px;}
.pcard{justify-self:start;display:flex;gap:12px;align-items:center;background:var(--paper);padding:10px 20px 10px 12px;border-radius:3px;
  box-shadow:0 8px 18px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.25);transform:rotate(-1.4deg);position:relative;transition:transform .35s cubic-bezier(.3,1.5,.5,1);min-width:0;max-width:100%}
.pcard.p1{justify-self:end;transform:rotate(1.2deg)}
.pcard::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;background:rgba(255,253,235,.6);transform:translateX(-50%) rotate(-4deg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.pcard.active{transform:rotate(0deg) scale(1.08)}
.pcard .name{font-weight:800;font-size:clamp(17px,2vw,30px);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:14ch;position:relative}
.pcard.active .name::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:5px;background:var(--c);border-radius:4px 10px 3px 12px;transform:rotate(-1deg)}
.pcard .icons{display:flex;gap:6px;align-items:flex-end;margin-top:4px}
.pcard .icons svg{display:block}
.pcard .turn{font-size:clamp(12px,1vw,15px);color:var(--c);font-weight:600;height:1.2em}
.center{text-align:center;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.45)}
#round{font-family:var(--brush);font-size:clamp(16px,1.7vw,24px);opacity:.85}
#status{font-size:clamp(17px,2.3vw,34px);font-weight:600;max-width:34ch;line-height:1.15;min-height:1.2em}
#status.warn{color:#ffd7dd}

/* board */
.stage{display:grid;place-items:center;min-height:0;min-width:0;padding:6px 10px;overflow:hidden}
.board{position:relative;perspective:2600px;perspective-origin:50% 40%;width:300px;height:200px}
.sb{position:absolute;box-shadow:0 34px 60px rgba(0,0,0,.38),0 10px 20px rgba(0,0,0,.28);border-radius:2px}
.board:not(.vert) .sb{top:0;bottom:0;width:50%}
.board:not(.vert) #sb0{left:0}.board:not(.vert) #sb1{left:50%}
.board.vert .sb{left:0;right:0;height:50%}
.board.vert #sb0{top:50%}.board.vert #sb1{top:0}
.paper{position:absolute;inset:0;display:flex;transform-style:preserve-3d}
.board.vert .paper{flex-direction:column}
.board.vert #half1{order:0}.board.vert #half0{order:1}
.half{position:relative;flex:1;min-width:0;min-height:0;transform-style:preserve-3d}
.board:not(.vert) #half0{transform-origin:100% 50%}
.board:not(.vert) #half1{transform-origin:0% 50%}
.board.vert #half0{transform-origin:50% 0%}
.board.vert #half1{transform-origin:50% 100%}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.board.vert .face.back{transform:rotateX(180deg)}
.face canvas{width:100%;height:100%;display:block;touch-action:none}
.shade{position:absolute;inset:0;background:#141217;opacity:0;pointer-events:none}
.cast{position:absolute;inset:0;opacity:0;pointer-events:none}
.board:not(.vert) #half0 .cast{background:linear-gradient(to left, rgba(0,0,0,.55), rgba(0,0,0,.18) 70%, rgba(0,0,0,.05))}
.board:not(.vert) #half1 .cast{background:linear-gradient(to right, rgba(0,0,0,.55), rgba(0,0,0,.18) 70%, rgba(0,0,0,.05))}
.board.vert #half0 .cast{background:linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,.18) 70%, rgba(0,0,0,.05))}
.board.vert #half1 .cast{background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,.18) 70%, rgba(0,0,0,.05))}
.press{position:absolute;opacity:0;pointer-events:none;border-radius:50%;
  background:radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,.25) 55%, rgba(0,0,0,0));transform:translateZ(40px)}
.board:not(.vert) .press{top:-6%;bottom:-6%;width:56%}
.board:not(.vert) #press0{left:-3%}.board:not(.vert) #press1{left:47%}
.board.vert .press{left:-6%;right:-6%;height:56%}
.board.vert #press0{top:47%}.board.vert #press1{top:-3%}
#floaters{position:absolute;inset:0;pointer-events:none;transform:translateZ(120px)}
.floater{position:absolute;transform:translate(-50%,-50%);font-family:var(--brush);font-size:clamp(22px,3vw,48px);color:var(--c);white-space:nowrap;
  text-shadow:0 2px 0 #fff,0 0 14px rgba(255,255,255,.9),0 0 3px #fff;animation:floatUp 1.7s ease-out forwards}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,-20%) scale(.5) rotate(-8deg)}
  14%{opacity:1;transform:translate(-50%,-70%) scale(1.15) rotate(-3deg)}
  72%{opacity:1;transform:translate(-50%,-110%) scale(1) rotate(-2deg)}
  100%{opacity:0;transform:translate(-50%,-170%) scale(.95) rotate(-1deg)}
}

/* controls */
.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 16px 18px}
.group{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.group[hidden]{display:none}
.btn{font-family:var(--hand);font-weight:800;font-size:clamp(15px,1.5vw,22px);padding:.55em 1.25em;border:3px solid var(--ink);background:var(--paper);color:var(--ink);
  border-radius:255px 18px 225px 18px/18px 225px 18px 255px;cursor:pointer;box-shadow:3px 4px 0 rgba(0,0,0,.4);transition:transform .12s,box-shadow .12s,opacity .2s}
.btn:hover{transform:translate(-1px,-2px) rotate(-1deg);box-shadow:5px 6px 0 rgba(0,0,0,.4)}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 rgba(0,0,0,.4)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 4px 0 rgba(0,0,0,.25)}
.btn.primary{background:var(--pc,var(--p0));color:#fff;font-size:clamp(17px,1.8vw,26px);padding:.55em 1.6em}
.btn:focus-visible{outline:3px dashed #fff;outline-offset:4px}
.btn.icon{padding:0;width:2.5em;height:2.5em;display:grid;place-items:center;border-radius:50% 46% 52% 44%/48% 54% 46% 52%}
.btn.icon svg{width:1.2em;height:1.2em}
.btn[hidden]{display:none}
.kbd{font-size:.7em;opacity:.8;font-weight:600}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(36,33,31,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.overlay[hidden]{display:none}
.overlay.solid{background:var(--granite-2);backdrop-filter:none}
.sheet{position:relative;background:var(--paper);width:100%;max-width:760px;max-height:calc(100% - 8px);overflow:auto;padding:clamp(20px,4vw,48px);border-radius:3px;
  box-shadow:0 30px 70px rgba(0,0,0,.45),0 4px 10px rgba(0,0,0,.3);transform:rotate(-.7deg);-webkit-user-select:text;user-select:text;overscroll-behavior:contain}
.sheet::before,.sheet::after{content:"";position:absolute;top:-8px;width:90px;height:24px;background:rgba(255,253,230,.65);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sheet::before{left:24px;transform:rotate(-8deg)}
.sheet::after{right:24px;transform:rotate(7deg)}
.title{font-family:var(--brush);font-size:clamp(56px,11vw,140px);line-height:.85;margin:0 0 .15em;color:var(--ink);letter-spacing:.01em}
.title .fold{display:inline-block;color:var(--p0);transform:rotate(-4deg)}
.title .hit{display:inline-block;color:var(--p1);transform:rotate(3deg)}
.tag{font-size:clamp(16px,1.8vw,23px);margin:0 0 1.1em;color:var(--ink-soft);max-width:44ch}
.rules{margin:0 0 1.3em;padding-left:1.4em;font-size:clamp(14px,1.5vw,19px);line-height:1.5}
.rules li{margin:.15em 0}
.opts{display:grid;grid-template-columns:auto 1fr;gap:12px 18px;align-items:center;margin-bottom:1.5em}
.opts .lbl{font-weight:800;font-size:clamp(14px,1.4vw,18px)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{font-family:var(--hand);font-weight:600;font-size:clamp(14px,1.3vw,17px);padding:.35em .9em;border:2.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;
  border-radius:255px 14px 225px 14px/14px 225px 14px 255px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:3px dashed var(--p0);outline-offset:3px}
.names{display:flex;gap:18px;flex-wrap:wrap}
.names label{display:flex;align-items:center;gap:8px;font-weight:600}
.names input{font-family:var(--hand);font-size:max(16px,min(1.6vw,21px));font-weight:800;width:9.5em;border:none;border-bottom:3px solid var(--c);background:transparent;color:var(--ink);padding:2px 2px;outline:none;border-radius:0}
.names input:focus{background:rgba(0,0,0,.04)}
.dotc{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:inset -2px -2px 0 rgba(0,0,0,.2)}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hint{font-size:13px;color:var(--ink-soft);margin-top:1.2em}
.acct{margin:1.4em 0 0;padding-top:1em;border-top:2px dashed rgba(0,0,0,.15);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:clamp(14px,1.4vw,17px);color:var(--ink-soft)}
.acct[hidden]{display:none}
.acct .rec{font-weight:600;color:var(--ink)}
.acct .btn{font-size:clamp(14px,1.3vw,17px);padding:.4em 1em}
.big{font-family:var(--brush);font-size:clamp(50px,9vw,120px);line-height:.9;margin:0 0 .2em;color:var(--c)}
.stats{width:100%;border-collapse:collapse;margin:.6em 0 1.4em;font-size:clamp(15px,1.6vw,20px)}
.stats th,.stats td{padding:.35em .5em;text-align:left;border-bottom:2px dashed rgba(0,0,0,.15)}
.stats th{font-weight:800}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

@media (max-width:640px){
  .bar{grid-template-columns:1fr 1fr;padding:10px 10px 0;gap:4px 8px}
  .center{grid-column:1 / -1;grid-row:2;display:flex;justify-content:center;align-items:baseline;gap:8px}
  .pcard{padding:5px 8px 5px 8px;gap:6px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
  .pcard::before{width:44px;height:12px;top:-6px}
  .pcard.active{transform:rotate(0deg) scale(1.03)}
  .pcard>svg:first-child,.pcard .turn{display:none}
  .pcard>div{display:flex;align-items:center;gap:6px;min-width:0}
  .pcard .name{font-size:14px;max-width:8ch}
  .pcard .icons{gap:1px;margin-top:0}
  .pcard .icons svg{width:11px;height:17px}
  .pcard .icons span svg{width:18px;height:17px}
  .pcard .icons span{margin-left:2px!important;gap:2px!important}
  .pcard .icons i{width:5px!important;height:5px!important}
  #round{font-size:14px}
  #status{font-size:15px;min-height:0}
  .controls{gap:6px;padding:4px 8px 10px;flex-wrap:nowrap}
  .group{gap:6px;flex-wrap:nowrap}
  .controls .btn{font-size:14px;padding:.5em .8em;border-width:2.5px;white-space:nowrap}
  .controls .btn.primary{font-size:15px;padding:.5em 1em}
  .controls .btn.icon{padding:0;width:2.3em;height:2.3em}
  .controls .kbd{display:none}
  .opts{gap:10px 12px}
}
@media (max-height:520px){
  .bar{padding-top:8px}
  .controls{padding:4px 12px 8px}
  .pcard{padding:6px 14px 6px 8px}
}
@media (pointer:coarse){
  .kbd,.hint{display:none}
}
@media (prefers-reduced-motion: reduce){
  .floater{animation-duration:1.2s}
  .pcard{transition:none}
}
</style>
</head>
<body class="booting">
<div id="app">
  <header class="bar">
    <div class="pcard p0" id="pc0"></div>
    <div class="center"><div id="round"></div><div id="status" aria-live="polite"></div></div>
    <div class="pcard p1" id="pc1"></div>
  </header>

  <main class="stage" id="stage">
    <div class="board" id="board">
      <div class="sb" id="sb0"></div><div class="sb" id="sb1"></div>
      <div class="paper" id="paper">
        <div class="half" id="half0">
          <div class="face front"><canvas id="cv0"></canvas><div class="cast"></div><div class="shade"></div></div>
          <div class="face back"><canvas></canvas><div class="shade"></div></div>
        </div>
        <div class="half" id="half1">
          <div class="face front"><canvas id="cv1"></canvas><div class="cast"></div><div class="shade"></div></div>
          <div class="face back"><canvas></canvas><div class="shade"></div></div>
        </div>
      </div>
      <div class="press" id="press0"></div><div class="press" id="press1"></div>
      <div id="floaters"></div>
    </div>
  </main>

  <footer class="controls">
    <div class="group" id="gSetup" hidden>
      <button class="btn" id="btnRandom"><span data-i18n="random"></span> <span class="kbd">R</span></button>
      <button class="btn" id="btnClear" data-i18n="clear"></button>
      <button class="btn primary" id="btnReady" data-i18n="ready"></button>
    </div>
    <div class="group" id="gAim" hidden>
      <button class="btn primary" id="btnFold" disabled><span data-i18n="fold"></span> <span class="kbd" data-i18n="space"></span></button>
    </div>
    <div class="group">
      <button class="btn icon" id="btnSound"></button>
      <button class="btn icon" id="btnFull">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="btn icon" id="btnMenu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M4 6.5c5-.6 11 .5 16-.3M4 12c6 .4 10-.4 16 .2M4 17.5c5-.5 11 .4 16-.2"/></svg>
      </button>
    </div>
  </footer>
</div>

<canvas id="fx"></canvas>

<div class="overlay" id="menu">
  <div class="sheet">
    <h1 class="title"><span class="fold" data-i18n="t1"></span> <span class="hit" data-i18n="t2"></span></h1>
    <p class="tag" data-i18n="tag"></p>
    <ol class="rules">
      <li data-i18n="r1"></li><li data-i18n="r2"></li><li data-i18n="r3"></li><li data-i18n="r4"></li><li data-i18n="r5"></li>
    </ol>
    <div class="opts">
      <div class="lbl" data-i18n="mode"></div>
      <div class="seg" data-key="mode"><button data-val="ai" data-i18n="vsAi"></button><button data-val="pvp" data-i18n="pvp"></button></div>
      <div class="lbl" id="lvlLbl" data-i18n="cpu"></div>
      <div class="seg" data-key="level" id="lvlSeg"><button data-val="easy" data-i18n="easy"></button><button data-val="normal" data-i18n="normal"></button><button data-val="hard" data-i18n="hard"></button></div>
      <div class="lbl" data-i18n="tremor"></div>
      <div class="seg" data-key="tremor"><button data-val="1" data-i18n="on"></button><button data-val="0" data-i18n="off"></button></div>
      <div class="lbl" data-i18n="hidden"></div>
      <div class="seg" data-key="hidden"><button data-val="0" data-i18n="off"></button><button data-val="1" data-i18n="on"></button></div>
      <div class="lbl" data-i18n="assist"></div>
      <div class="seg" data-key="assist"><button data-val="0" data-i18n="off"></button><button data-val="1" data-i18n="on"></button></div>
      <div class="lbl" data-i18n="names"></div>
      <div class="names">
        <label style="--c:var(--p0)"><span class="dotc"></span><input id="n0" maxlength="14" autocomplete="off" spellcheck="false"></label>
        <label style="--c:var(--p1)"><span class="dotc"></span><input id="n1" maxlength="14" autocomplete="off" spellcheck="false"></label>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="btnStart" style="--pc:var(--p0)" data-i18n="start"></button>
      <button class="btn" id="btnResume" hidden data-i18n="resume"></button>
    </div>
    <p class="hint" data-i18n="hint"></p>
    <div class="acct" id="acct" hidden>
      <span id="acctText"></span>
      <span class="rec" id="acctRec"></span>
      <button class="btn" id="btnLogin" hidden data-i18n="login"></button>
    </div>
  </div>
</div>

<div class="overlay solid" id="handoff" hidden>
  <div class="sheet" style="max-width:560px;text-align:center">
    <p class="big" id="hoName"></p>
    <p class="tag" style="margin:0 auto 1.4em" id="hoText"></p>
    <button class="btn primary" id="btnHo" data-i18n="imReady"></button>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="sheet" style="max-width:640px">
    <p class="big" id="ovTitle"></p>
    <table class="stats" id="ovStats"></table>
    <div class="actions">
      <button class="btn primary" id="btnAgain" data-i18n="again"></button>
      <button class="btn" id="btnToMenu" data-i18n="toMenu"></button>
    </div>
  </div>
</div>

<script>
(()=>{
"use strict";

/* ---------------- parolla SDK (falls back to a no-op shim if the script could not load) ---------------- */
const sdk=window.ParollaGames||{
  init:()=>Promise.resolve({locale:(navigator.language||'').toLowerCase().startsWith('tr')?'tr':'en',user:null,invite:null,invitedBy:null,standalone:true}),
  requestLogin(){},gameplayStart(){},gameplayStop(){},
  cloud:{save:()=>Promise.reject(new Error('cloud_unavailable')),load:()=>Promise.resolve(null)}
};
const safe=fn=>{try{const r=fn();if(r&&r.catch)r.catch(()=>{});}catch(e){}};

/* ---------------- i18n ---------------- */
const STR={
  tr:{
    t1:'Katla',t2:'Vur',
    tag:'Kendi yarına bir damla oje koy, kâğıdı katla, bastır. İz rakibin tarafına aynalanarak geçer.',
    r1:'Sadece kendi yarına damlatırsın.',
    r2:'Kâğıt katlanır, damla katlama çizgisine göre ayna görüntüsü olarak karşıya basılır.',
    r3:'İz rakibin adamına değerse adam gider. Ev iki vuruşta yıkılır.',
    r4:'Damla kendi adamının üstüne düşerse kendini vurursun.',
    r5:'Önce tüm adamları ve evi giden kaybeder.',
    mode:'Mod',vsAi:'Bilgisayara karşı',pvp:'İki kişi',cpu:'Bilgisayar',easy:'Kolay',normal:'Orta',hard:'Zor',
    tremor:'El titremesi',on:'Açık',off:'Kapalı',hidden:'Gizli dizilim',assist:'Nişan yardımı',names:'İsimler',
    start:'Oyunu başlat',resume:'Devam et',hint:'Kısayollar: Boşluk katla, R rastgele diz, M ses.',
    random:'Rastgele diz',clear:'Temizle',ready:'Hazır',fold:'Katla ve bas',space:'Boşluk',

/* ---------------- geometry & pieces ---------------- */
const ext=type=>isVert()?(type==='house'?HOUSE_V:FIG_V):(type==='house'?HOUSE:FIG);

function randomLayout(pl){
  for(let tries=0;tries<60;tries++){
    pl.pieces=[];let ok=true;
    for(const type of ['house','fig','fig','fig']){
      let placed=false;
      for(let k=0;k<300;k++){const b=bounds(type),d=lerp(b.d0,b.d1,Math.random()),y=lerp(b.y0,b.y1,Math.random());
        if(canPlace(pl,type,d,y)){pl.pieces.push(makePiece(type,d,y));placed=true;break;}}

  c.fillStyle=back?'#f0ede5':'#fbf9f3';c.fillRect(0,0,W,H);

  c.putImageData(id,0,0);

/* ---------------- visibility & aim ---------------- */
function viewer(){if(cfg.mode==='ai')return 0;return S.phase==='setup'?S.setupIdx:S.turn;}

function aimPos(t){
  const hv=S.hover;let d=hv.d,y=hv.y;
  if(cfg.tremor&&!RM){const A=.024;d+=A*(Math.sin(t*.0061)+Math.sin(t*.0137+1.3))*.5;y+=A*ASPECT*(Math.sin(t*.0053+2)+Math.sin(t*.0109))*.5;}

}

function drawHalf(i,t){

  const nm=S?S.players[i].name:(cfg.names[i]||defName(i,cfg.mode));drawDecor(c,i,u,(nm||'?').trim().charAt(0).toLocaleUpperCase(LANG)||'?');
  if(!S)return;
  const pl=S.players[i];
  for(const p of pl.pieces)if(visible(i,p))drawPiece(c,i,p,t,u);
  for(const m of S.marks[i])drawMark(c,i,m,t,u);
  for(const p of pl.pieces)if(visible(i,p)&&(!p.alive||p.hp<p.maxHp))drawDamage(c,i,p,t,u);
  if(S.pending&&S.turn===i)drawMark(c,i,{...S.pending,kind:'dot',color:pl.color,pending:true},t,u);
  if(S.phase==='setup'&&S.hover&&S.hover.i===i&&i===S.setupIdx&&!pl.isAI&&!S.overlay&&!S.hover.touch){
    const type=nextType(pl);if(type&&!pl.pieces.some(p=>inside(p,S.hover.d,S.hover.y))){
      const ok=canPlace(pl,type,S.hover.d,S.hover.y);drawPiece(c,i,{type,d:S.hover.d,y:S.hover.y,seed:4242,pose:0,hitT:-1e9,alive:true},t,u,ok?INK:'#c0392b',ok?.35:.5);}
  }

  if(cfg.assist&&S.phase==='aim'&&S.hover&&S.hover.i===1-i&&canAim(1-i)){

/* ---------------- fx ---------------- */
function screenPt(i,d,y){const h=halves[i],r=h.front.getBoundingClientRect(),[px,py]=toPx(i,d,y);return [r.left+px/h.W*r.width,r.top+py/h.H*r.height];}
function burst(i,d,y,color,n=30){if(RM)n=8;const [x,yy]=screenPt(i,d,y);
  for(let k=0;k<n;k++){const a=Math.random()*6.28,sp=120+Math.random()*420;parts.push({k:'drop',x,y:yy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-160,g:900,r:2+Math.random()*5,c:Math.random()<.3?shade(color,.3):color,life:.6+Math.random()*.6,max:1.2});}}

  for(let k=0;k<44;k++){const s=Math.random();let x,y,vx,vy;const sp=60+Math.random()*180;
    if(side==='right'||side==='left'){
      if(s<.35){x=r.left+Math.random()*r.width;y=r.top;vx=(Math.random()-.5)*60;vy=-sp;}
      else if(s<.7){x=r.left+Math.random()*r.width;y=r.bottom;vx=(Math.random()-.5)*60;vy=sp;}
      else{x=side==='right'?r.left:r.right;y=r.top+Math.random()*r.height;vx=(side==='right'?-1:1)*sp;vy=(Math.random()-.5)*60;}

    if(ty==='house')return tr('placeHouse',pl.name);

/* ---------------- progress: localStorage for everyone, parolla cloud when signed in ---------------- */
const STAT_KEYS=['g_easy','w_easy','g_normal','w_normal','g_hard','w_hard','g_pvp','shots','hits'];
const CLOUD_KEY='progress';
const LS_GUEST='katlavur.progress.guest';
let account={user:null,standalone:true};
let progress={v:1,updatedAt:0,settings:null,stats:{}};
const lsKey=()=>account.user?'katlavur.progress.'+account.user.sub:LS_GUEST;
const lsGet=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k);}catch(e){}};
function validProg(p){return p&&typeof p==='object'&&p.v===1&&p.stats&&typeof p.stats==='object'?p:null;}
function mergeProg(a,b){
  a=validProg(a);b=validProg(b);if(!a)return b;if(!b)return a;
  const newer=(a.updatedAt||0)>=(b.updatedAt||0)?a:b,stats={};
  for(const k of STAT_KEYS)stats[k]=Math.max(+a.stats[k]||0,+b.stats[k]||0);
  return {v:1,updatedAt:Math.max(a.updatedAt||0,b.updatedAt||0),settings:newer.settings||a.settings||b.settings||null,stats};
}
const sameStats=(a,b)=>!!a&&!!b&&STAT_KEYS.every(k=>(+a.stats[k]||0)===(+b.stats[k]||0))&&JSON.stringify(a.settings)===JSON.stringify(b.settings);
let cloudTimer=null;
function saveProgress(){
  progress.updatedAt=Date.now();
  lsSet(lsKey(),progress);
  if(!account.user)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(()=>{sdk.cloud.save(CLOUD_KEY,progress).catch(()=>{});},2500);
}
function settingsSnapshot(){
  return {mode:cfg.mode,level:cfg.level,tremor:cfg.tremor,hidden:cfg.hidden,assist:cfg.assist,
    names:cfg.names.map(n=>{n=(n||'').trim();return DEFAULT_NAMES.has(n)?'':n;})};
}
function applySettings(s){
  if(!s||typeof s!=='object')return;
  if(s.mode==='ai'||s.mode==='pvp')cfg.mode=s.mode;
  if(['easy','normal','hard'].includes(s.level))cfg.level=s.level;
  for(const k of ['tremor','hidden','assist'])if(typeof s[k]==='boolean')cfg[k]=s[k];
  if(Array.isArray(s.names))cfg.names=[0,1].map(i=>typeof s.names[i]==='string'?s.names[i].slice(0,14):'');
}
function persistSettings(){progress.settings=settingsSnapshot();saveProgress();}
function recordGame(w){
  const st=progress.stats,P=S.players,inc=k=>{st[k]=(+st[k]||0)+1;};
  if(cfg.mode==='ai'){inc('g_'+cfg.level);if(w===0)inc('w_'+cfg.level);st.shots=(+st.shots||0)+P[0].shots;st.hits=(+st.hits||0)+P[0].hits;}
  else{inc('g_pvp');st.shots=(+st.shots||0)+P[0].shots+P[1].shots;st.hits=(+st.hits||0)+P[0].hits+P[1].hits;}
  saveProgress();renderAccount();
}
async function loadAccount(info){
  account={user:info&&info.user||null,standalone:!info||info.standalone!==false};
  const guest=lsGet(LS_GUEST);
  if(account.user){
    const mine=lsGet(lsKey());
    let cloud=null,cloudOk=true;
    try{cloud=await sdk.cloud.load(CLOUD_KEY);}catch(e){cloudOk=false;}
    const merged=mergeProg(mergeProg(mine,guest),cloud);
    if(merged)progress=merged;
    lsSet(lsKey(),progress);
    if(guest)lsDel(LS_GUEST);   // guest progress now lives in the account
    if(cloudOk&&merged&&!sameStats(merged,validProg(cloud))){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>sdk.cloud.save(CLOUD_KEY,progress).catch(()=>{}),2500);}
  }else if(validProg(guest))progress=guest;
  if(!progress.stats)progress.stats={};
  applySettings(progress.settings);
  if(account.user&&!cfg.names[0])cfg.names[0]=String(account.user.name||'').trim().slice(0,14);
}
function renderAccount(){
  const box=$('#acct'),st=progress.stats;
  const any=STAT_KEYS.some(k=>+st[k]>0);
  const wl=lv=>`${+st['w_'+lv]||0}/${+st['g_'+lv]||0}`;
  $('#acctRec').textContent=any?tr('record',wl('easy'),wl('normal'),wl('hard')):'';
  let txt='';
  if(account.user)txt=tr('hello',account.user.name||'');
  else if(!account.standalone)txt=tr('guest');
  else if(any)txt=tr('local');
  $('#acctText').textContent=txt;
  $('#btnLogin').hidden=!!account.user||account.standalone;
  box.hidden=!txt&&!any&&$('#btnLogin').hidden;
}

/* ---------------- flow ---------------- */
function playerName(i){return (cfg.names[i]||'').trim()||defName(i,cfg.mode);}
function newGame(){
  S={phase:'setup',turn:0,setupIdx:0,round:1,pending:null,hover:null,aiHover:null,overlay:null,marks:[[],[]],vert:wantVert(),
    players:[0,1].map(i=>({name:playerName(i),color:COLORS[i],isAI:cfg.mode==='ai'&&i===1,pieces:[],shots:0,hits:0,self:0}))};
  if(S.players[1].isAI)randomLayout(S.players[1]);
  $('#menu').hidden=true;$('#over').hidden=true;$('#handoff').hidden=true;
  parts=[];$('#floaters').innerHTML='';
  resize();halves.forEach((h,i)=>{drawHalf(i,now());drawBack(i);});
  updateUI();snd.rustle(.5);
  if(cfg.mode==='pvp'&&cfg.hidden)showHandoff(0,tr('setupNoLook'));
}
function showHandoff(i,text){S.overlay='handoff';const pl=S.players[i];const n=$('#hoName');n.textContent=tr('turnOf',pl.name);n.style.setProperty('--c',pl.color);
  $('#hoText').textContent=text||tr('noLook');$('#btnHo').style.setProperty('--pc',pl.color);$('#handoff').hidden=false;$('#btnHo').focus({preventScroll:true});}
function ready(){
  if(!S||S.phase!=='setup'||S.overlay)return;const pl=S.players[S.setupIdx];if(nextType(pl)){flash(tr('needAll'));return;}
  if(cfg.mode==='pvp'&&S.setupIdx===0){S.setupIdx=1;updateUI();snd.rustle(.3);if(cfg.hidden)showHandoff(1,tr('setupNoLook'));return;}
  S.phase='aim';S.turn=0;S.pending=null;updateUI();snd.rustle(.4);
  if(cfg.mode==='pvp'&&cfg.hidden)showHandoff(0);
}
function nextTurn(){
  S.turn=1-S.turn;if(S.turn===0)S.round++;S.phase='aim';S.pending=null;updateUI();
  if(S.players[S.turn].isAI)aiTurn();else if(cfg.mode==='pvp'&&cfg.hidden)showHandoff(S.turn);
}
async function foldAndPress(){
  if(!S||S.phase!=='aim'||!S.pending||S.overlay)return;
  const G=S,me=S.turn,op=1-me,P=S.players,aim=S.pending;S.pending=null;S.hover=null;S.phase='folding';updateUI();
  S.marks[me].push({d:aim.d,y:aim.y,kind:'dot',color:P[me].color,seed:aim.seed,t:now()-1000});P[me].shots++;
  drawHalf(me,now());drawBack(me);
  const h=halves[me],T=RM?260:760,vert=S.vert,dir=me===0?1:-1,rot=vert?'rotateX':'rotateY';
  h.el.style.zIndex=5;
  snd.rustle(T/1000);
  const kf=[{transform:`translateZ(0px) ${rot}(0deg)`},{transform:`translateZ(${RM?0:80}px) ${rot}(${dir*90}deg)`,offset:.5},{transform:`translateZ(1px) ${rot}(${dir*180}deg)`}];
  const opt={duration:T,easing:'cubic-bezier(.55,.05,.4,1)',fill:'forwards'};
  const shK=[{opacity:0},{opacity:.42,offset:.5},{opacity:.42}],bsK=[{opacity:.5},{opacity:.5,offset:.5},{opacity:0}],caK=[{opacity:0},{opacity:.6,offset:.7},{opacity:.75}],sbK=[{opacity:1},{opacity:.2}];
  const A=[h.el.animate(kf,opt),h.shade.animate(shK,opt),h.bshade.animate(bsK,opt),halves[op].cast.animate(caK,opt),$('#sb'+me).animate(sbK,opt)];
  await A[0].finished;
  const press=$('#press'+op);
  if(!RM)await press.animate([{opacity:0,transform:'translateZ(40px) scale(1.4)'},{opacity:.6,transform:'translateZ(40px) scale(.92)'}],{duration:280,easing:'ease-in',fill:'forwards'}).finished;
  snd.thump();shake();dustPuff(op);
  const tp={d:clamp(aim.d+gauss()*.006,.01,.99),y:clamp(aim.y+gauss()*.005,.01,.99)};
  S.marks[op].push({d:tp.d,y:tp.y,kind:'transfer',color:P[me].color,seed:aim.seed,t:now()-1000});
  await wait(RM?80:360);
  press.animate([{opacity:.6,transform:'translateZ(40px) scale(.92)'},{opacity:0,transform:'translateZ(40px) scale(1.2)'}],{duration:260,fill:'forwards'});
  snd.rustle(T*.9/1000);
  const opt2={...opt,duration:T*.9,easing:'cubic-bezier(.6,0,.45,1)'};
  const B=[h.el.animate([...kf].reverse(),opt2),h.shade.animate([...shK].reverse(),opt2),h.bshade.animate([...bsK].reverse(),opt2),halves[op].cast.animate([...caK].reverse(),opt2),$('#sb'+me).animate([...sbK].reverse(),opt2)];
  A.forEach(a=>a.cancel());
  await B[0].finished;B.forEach(b=>b.cancel());h.el.style.zIndex='';
  if(S!==G)return;   // a new game was started meanwhile
  resolve(me,op,aim,tp);
}
function damage(p,color,t){p.hp--;p.revealed=true;p.hitT=t;p.hitColor=color;if(p.hp<=0)p.alive=false;}
function resolve(me,op,aim,tp){
  const G=S,P=S.players,t=now(),ev=[];
  for(const p of P[op].pieces)if(p.alive&&hits(p,tp.d,tp.y)){damage(p,P[me].color,t);ev.push({self:false,p,i:op});}
  for(const p of P[me].pieces)if(p.alive&&hits(p,aim.d,aim.y)){damage(p,INK,t);ev.push({self:true,p,i:me});}
  P[me].hits+=ev.filter(e=>!e.self).length;P[me].self+=ev.filter(e=>e.self).length;
  if(!ev.length){floater(op,tp.d,tp.y,tr('miss'),INK);snd.miss();}
  ev.forEach((e,k)=>setTimeout(()=>{if(S!==G)return;
    const txt=e.p.type==='fig'?(e.self?tr('selfFig'):tr('hit')):(e.p.alive?(e.self?tr('selfHouseDmg'):tr('houseCrack')):(e.self?tr('selfHouseKill'):tr('houseKill')));
    floater(e.i,e.p.d,e.p.y,txt,e.self?INK:P[me].color);e.self?snd.bad():snd.hit();burst(e.i,e.p.d,e.p.y,e.self?INK:P[me].color);
  },k*280));
  updateUI();
  const lostOp=!P[op].pieces.some(p=>p.alive),lostMe=!P[me].pieces.some(p=>p.alive);
  setTimeout(()=>{if(S!==G)return;if(lostOp||lostMe)gameOver(lostOp&&lostMe?-1:lostOp?me:op);else nextTurn();},ev.length?950+ev.length*280:620);
}
function gameOver(w){
  const G=S;
  S.phase='over';S.pending=null;updateUI();snd.win();confetti([COLORS[0],COLORS[1],'#fbf9f3',INK,w>=0?COLORS[w]:INK]);
  recordGame(w);
  setTimeout(()=>{if(S!==G)return;
    const t=$('#ovTitle');
    if(w<0){t.textContent=tr('draw');t.style.setProperty('--c',INK);}else{t.textContent=tr('wins',S.players[w].name);t.style.setProperty('--c',S.players[w].color);}
    const P=S.players,row=(lbl,f)=>`<tr><th>${lbl}</th>${P.map(f).join('')}</tr>`;
    $('#ovStats').innerHTML=`<tr><th></th>${P.map(p=>`<th style="color:${p.color}">${esc(p.name)}</th>`).join('')}</tr>`+
      row(tr('shots'),p=>`<td>${p.shots}</td>`)+row(tr('hits'),p=>`<td>${p.hits}</td>`)+
      row(tr('acc'),p=>`<td>${p.shots?Math.round(p.hits/p.shots*100):0}%</td>`)+row(tr('selfHits'),p=>`<td>${p.self}</td>`)+row(tr('rounds'),()=>`<td>${S.round}</td>`);
    $('#btnAgain').style.setProperty('--pc',w>=0?S.players[w].color:INK);
    $('#over').hidden=false;$('#btnAgain').focus({preventScroll:true});
  },RM?300:1100);
}

/* ---------------- AI ---------------- */
function aiChoose(){
  const me=S.players[1],op=S.players[0],sig={easy:.09,normal:.045,hard:.02}[cfg.level]||.045;
  const shots=S.marks[1].filter(m=>m.kind==='dot');
  const known=op.pieces.filter(p=>p.alive&&(!cfg.hidden||p.revealed));
  for(let a=0;a<80;a++){
    let base;
    if(known.length){const hurt=known.find(p=>p.type==='house'&&p.hp<p.maxHp),figs=known.filter(p=>p.type==='fig');
      const pool=hurt?[hurt]:(figs.length&&Math.random()<.75?figs:known);base=pool[Math.floor(Math.random()*pool.length)];}
    else{let best=null,bs=-1;for(let k=0;k<30;k++){const c={d:lerp(.1,.92,Math.random()),y:lerp(.1,.92,Math.random())};
      let sc=shots.reduce((m,s)=>Math.min(m,Math.hypot(c.d-s.d,(c.y-s.y)/ASPECT)),9);if(sc>bs){bs=sc;best=c;}}base=best;}
    const aim={d:clamp(base.d+gauss()*sig,.03,.97),y:clamp(base.y+gauss()*sig*ASPECT,.03,.97)};
    if(!me.pieces.some(p=>p.alive&&hits(p,aim.d,aim.y)))return aim;
  }
  return {d:.5,y:.5};
}
const tween=(ms,fn)=>new Promise(res=>{const t0=now();const step=()=>{const k=clamp((now()-t0)/ms,0,1);fn(k);k<1?requestAnimationFrame(step):res();};step();});
// waits while the menu is open or the tab is hidden, so the computer never plays behind a pause
async function whilePaused(G){while(S===G&&(S.overlay||document.visibilityState!=='visible'))await wait(200);}
async function aiTurn(){
  const G=S;
  await wait(RM?150:500);await whilePaused(G);if(S!==G||S.phase!=='aim')return;
  const target=aiChoose(),st={d:lerp(.2,.8,Math.random()),y:lerp(.2,.8,Math.random())};
  await tween(RM?200:1100,k=>{if(S!==G)return;const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,wob=(1-k)*.03;
    S.aiHover={i:1,d:lerp(st.d,target.d,e)+Math.sin(k*17)*wob,y:lerp(st.y,target.y,e)+Math.cos(k*13)*wob*ASPECT};});
  await wait(RM?60:220);await whilePaused(G);if(S!==G||S.phase!=='aim')return;
  S.aiHover=null;S.pending={d:target.d,y:target.y,seed:rseed(),t:now()};snd.place();updateUI();
  await wait(RM?150:520);await whilePaused(G);if(S!==G)return;foldAndPress();
}

/* ---------------- input ---------------- */
halves.forEach((h,i)=>{
  const el=h.front;
  const pos=e=>{const r=el.getBoundingClientRect(),q=fromFrac(i,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);return {i,d:q.d,y:q.y,touch:e.pointerType==='touch'};};
  const cursor=()=>{if(!S){el.style.cursor='default';return;}
    if(S.phase==='setup')el.style.cursor=(i===S.setupIdx&&!S.players[i].isAI)?'crosshair':'not-allowed';
    else if(S.phase==='aim')el.style.cursor=canAim(i)?'none':(!S.players[S.turn].isAI?'not-allowed':'default');
    else el.style.cursor='default';};
  el.addEventListener('pointermove',e=>{if(!S)return;if(e.pointerType==='touch'&&!e.buttons)return;S.hover=pos(e);cursor();});
  el.addEventListener('pointerleave',e=>{if(S&&e.pointerType!=='touch')S.hover=null;});
  el.addEventListener('pointerdown',e=>{
    snd.init();if(!S||S.overlay)return;S.hover=pos(e);cursor();const {d,y}=S.hover;
    if(S.phase==='setup'){const pl=S.players[S.setupIdx];if(i!==S.setupIdx||pl.isAI){flash(tr('ownHalf'));return;}
      const ex=pl.pieces.findIndex(p=>inside(p,d,y));if(ex>=0){pl.pieces.splice(ex,1);snd.miss();updateUI();return;}
      const type=nextType(pl);if(!type)return;if(!canPlace(pl,type,d,y)){snd.bad();flash(tr('noFit'));return;}
      pl.pieces.push(makePiece(type,d,y));snd.place();updateUI();return;}
    if(canAim(i)){const a=aimPos(now());S.pending={d:a.d,y:a.y,seed:rseed(),t:now()};snd.place();updateUI();}
    else if(S.phase==='aim'&&!S.players[S.turn].isAI&&i!==S.turn){snd.bad();flash(tr('onlyOwn'));}
  });
});
$('#btnFold').onclick=()=>{snd.init();foldAndPress();};
$('#btnReady').onclick=()=>{snd.init();ready();};
$('#btnRandom').onclick=()=>{snd.init();if(S&&S.phase==='setup'&&!S.overlay){randomLayout(S.players[S.setupIdx]);snd.rustle(.25);updateUI();}};
$('#btnClear').onclick=()=>{if(S&&S.phase==='setup'&&!S.overlay){S.players[S.setupIdx].pieces=[];updateUI();}};
$('#btnHo').onclick=()=>{snd.init();$('#handoff').hidden=true;if(S)S.overlay=null;};
$('#btnAgain').onclick=()=>{snd.init();newGame();};
$('#btnToMenu').onclick=()=>{$('#over').hidden=true;openMenu();};
$('#btnMenu').onclick=()=>openMenu();
$('#btnResume').onclick=()=>{$('#menu').hidden=true;if(S&&S.overlay==='menu')S.overlay=null;};
$('#btnStart').onclick=()=>{snd.init();cfg.names=[$('#n0').value,$('#n1').value];persistSettings();newGame();};
$('#btnLogin').onclick=()=>{persistSettings();safe(()=>sdk.requestLogin());};
function openMenu(){
  $('#menu').hidden=false;const live=S&&S.phase!=='over';$('#btnResume').hidden=!live;if(live&&!S.overlay)S.overlay='menu';
  $('#n0').value=cfg.names[0]||defName(0,cfg.mode);$('#n1').value=cfg.names[1]||defName(1,cfg.mode);
  syncMenu();renderAccount();
}
const soundIcon=()=>snd.on?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9c1.2 1.6 1.2 4.4 0 6M18.3 6.5c2.5 3 2.5 8 0 11"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
$('#btnSound').innerHTML=soundIcon();
$('#btnSound').onclick=()=>{snd.init();snd.on=!snd.on;$('#btnSound').innerHTML=soundIcon();};
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const toggleFull=()=>{const d=document.documentElement;
  if(!fsEl()){const f=d.requestFullscreen||d.webkitRequestFullscreen;if(f){const r=f.call(d);if(r&&r.catch)r.catch(()=>{});}}
  else{const x=document.exitFullscreen||document.webkitExitFullscreen;if(x)x.call(document);}};
$('#btnFull').onclick=toggleFull;
const embedded=window.parent!==window;   // inside parolla the portal's own fullscreen button is the one to use
if(embedded||!(document.fullscreenEnabled||document.webkitFullscreenEnabled))$('#btnFull').hidden=true;
document.addEventListener('fullscreenchange',()=>setTimeout(resize,60));

document.querySelectorAll('.seg').forEach(seg=>{
  seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const key=seg.dataset.key,v=b.dataset.val;
    if(key==='mode'){cfg.mode=v;const n1=$('#n1');const cur=n1.value.trim();
      if(!cur||DEFAULT_NAMES.has(cur))n1.value=defName(1,v);}
    else if(key==='level')cfg.level=v;else cfg[key]=v==='1';
    syncMenu();if(!S){renderCards();}
    cfg.names=[$('#n0').value,$('#n1').value];persistSettings();});
});
['#n0','#n1'].forEach(id=>$(id).addEventListener('change',()=>{cfg.names=[$('#n0').value,$('#n1').value];persistSettings();if(!S)renderCards();}));
function syncMenu(){
  document.querySelectorAll('.seg').forEach(seg=>{const key=seg.dataset.key;
    seg.querySelectorAll('button').forEach(b=>{const v=b.dataset.val;const on=key==='mode'?cfg.mode===v:key==='level'?cfg.level===v:(cfg[key]?'1':'0')===v;b.setAttribute('aria-pressed',on);});});
  const ai=cfg.mode==='ai';$('#lvlSeg').style.visibility=ai?'visible':'hidden';$('#lvlLbl').style.visibility=ai?'visible':'hidden';
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='f'){if(!$('#btnFull').hidden)toggleFull();return;}
  if(k==='m'){$('#btnSound').click();return;}
  if(!S||S.overlay)return;
  if(e.code==='Space'||k==='enter'){if(document.activeElement&&document.activeElement.tagName==='BUTTON'&&k==='enter')return;e.preventDefault();snd.init();
    if(S.phase==='aim')foldAndPress();else if(S.phase==='setup')ready();}
  if(k==='r'&&S.phase==='setup')$('#btnRandom').click();
});

/* pause audio while hidden (portal tab switch, app background) */
document.addEventListener('visibilitychange',()=>{
  if(snd.ctx){if(document.visibilityState==='hidden')snd.ctx.suspend().catch(()=>{});else if(snd.on)snd.ctx.resume().catch(()=>{});}
  syncGameplay();
});

/* ---------------- granite table ---------------- */
function granite(){const cv=document.createElement('canvas');cv.width=cv.height=420;const c=cv.getContext('2d');
  const cols=[['38,35,33',.55],['185,178,168',.5],['140,126,112',.45],['232,228,220',.5],['70,66,62',.5],['110,104,98',.6]];
  for(let k=0;k<11000;k++){const [col,a]=cols[k%cols.length];c.fillStyle=`rgba(${col},${a*Math.random()})`;const r=Math.random()<.92?.5+Math.random()*1.2:1.5+Math.random()*1.8;
    c.beginPath();c.arc(Math.random()*420,Math.random()*420,r,0,7);c.fill();}
  return cv.toDataURL();}
document.body.style.backgroundImage=`radial-gradient(ellipse at 50% 42%, rgba(255,255,255,.16), rgba(0,0,0,.32) 78%), url(${granite()})`;
document.body.style.backgroundSize='cover, 420px 420px';

/* ---------------- loop ---------------- */
let last=now(),lastStatus='';
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  drawHalf(0,t);drawHalf(1,t);stepFx(dt);
  const st=statusText(t);if(st!==lastStatus){const el=$('#status');el.textContent=st;el.classList.toggle('warn',st===tr('warnSelf'));lastStatus=st;}
  syncGameplay();
  requestAnimationFrame(loop);
}
let rzT=0;const onResize=()=>{cancelAnimationFrame(rzT);rzT=requestAnimationFrame(resize);};
window.addEventListener('resize',onResize);
if(window.ResizeObserver)new ResizeObserver(onResize).observe($('#stage'));

/* ---------------- boot: parolla init first, then everything else ---------------- */
async function boot(){
  let info=null;
  try{info=await Promise.race([sdk.init(),wait(12000).then(()=>{throw new Error('timeout');})]);}catch(e){info=null;}
  LANG=info&&info.locale==='en'?'en':info&&info.locale==='tr'?'tr':((navigator.language||'').toLowerCase().startsWith('tr')?'tr':'en');
  applyI18n();
  try{await loadAccount(info);}catch(e){}
  $('#n0').value=cfg.names[0]||defName(0,cfg.mode);$('#n1').value=cfg.names[1]||defName(1,cfg.mode);
  syncMenu();renderAccount();updateUI();
  document.body.classList.remove('booting');
  resize();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{brushFont=null;halves.forEach(h=>{h.W=0;});resize();});
  requestAnimationFrame(loop);
}
boot();
})();
